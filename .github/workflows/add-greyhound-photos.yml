name: Add Greyhound Photos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'uploads/**'

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  add-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.ROOBOT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - run: npm ci

      - id: add
        uses: actions/github-script@v7
        with:
          script: |
            const addGreyhoundPhotos = require('./script/add-greyhound-photos.js')
            const message = await addGreyhoundPhotos()
            core.setOutput('message', message)

      - id: push
        env:
          COMMIT_MESSAGE: ${{ steps.add.outputs.message }}
        run: |
          git config --global user.email 'website@galtx-centex.org'
          git config --global user.name 'Roobot'
          git add _greyhounds/ img/ uploads/
          if git diff --cached --quiet; then
            echo 'No uploaded greyhound photos to process.'
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:${{ github.ref_name }}
